name: Build site and deploy to gh-pages branch

on:
  push:
    branches:
    - master
  # Run build every day at 00:00 UTC every day for future-dated articles
  schedule:
    - cron:  '0 0 * * *' 

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby 3.0
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: '3.0'

    - name: Install Ruby dependencies
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3

    - name: Build and deploy to gh-pages branch
      run: |
        chmod 750 deployment-script.sh
        ./deployment-script.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        JEKYLL_ENV: production
