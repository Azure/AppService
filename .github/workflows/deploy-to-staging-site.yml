name: "Deploy to staging site"

on:
  pull_request:
    branches:
    - master

concurrency: ci-${{ github.event.number }}

env:
  WEBAPP_NAME: antares-blog-staging
  RESOURCE_GROUP: appserviceblogsite
  SLOT_NAME: pr-${{ github.event.number }}

permissions:
    id-token: write
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby 3.0
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Install Ruby dependencies
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3

    - name: Build site
      run: bundle exec jekyll build --future --baseurl=''
      env:
        JEKYLL_ENV: production

    - name: zip up site
      run: cd _site && zip -r ../blog.zip .
    
    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jekyll-app
        path: blog.zip
    
  set-up-test-env:
    name: Create test env
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
     id-token: write
     contents: read

    steps:
    - name: Run Azure Login with OIDC
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Azure CLI script
      uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
      with:
        azcliversion: latest
        inlineScript: |
          az account show

    - name: Create slot on staging site
      run: | 
        az webapp deployment slot create \
          --resource-group $RESOURCE_GROUP \
          --name $WEBAPP_NAME \
          --slot $SLOT_NAME

  deploy-to-slot:
    name: Deploy to test env
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    needs: [build, set-up-test-env]
    environment:
      name: "production"
      url: "${{ steps.deploy-to-webapp.outputs.webapp-url }}"
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
    - name: Run Azure Login with OIDC
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Azure CLI script
      uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
      with:
        azcliversion: latest
        inlineScript: |
          az account show

    - name: Download artifact from build job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: jekyll-app

    - name: Deploy to slot on staging site
      uses: Azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        slot-name: ${{ env.SLOT_NAME }}
        package: blog.zip
    
    - name: Comment on PR with the preview link
      uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
      with:
        message: |
          ## Preview link: https://antares-blog-staging-pr-${{ github.event.number }}.azurewebsites.net

          - Your changes have been deployed to the preview site. The preview site will update as you add more commits to this branch. 
          - The preview site shows any future-dated articles. If you are publishing a future-dated article, it will not show on the production site until the file's specified date.
          - The preview link is shareable, but will be deleted when this pull request is merged or closed.

          > *This is an automated message.*
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        repo-token-user-login: 'github-actions[bot]'
   
