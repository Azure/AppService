name: "Delete slot on staging site"

on:
  pull_request:
    types: [closed]

concurrency: 
  group: ci-${{ github.event.number }}
  cancel-in-progress: true

env:
  WEBAPP_NAME: antares-blog-staging
  RESOURCE_GROUP: appserviceblogsite
  SLOT_NAME: pr-${{ github.event.number }}

#OIDC
permissions:
    id-token: write
    contents: read

jobs:
  delete-slot:
    runs-on: ubuntu-latest

    steps:
    #OIDC
    - name: Run Azure Login with OIDC
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Delete slot on staging site
      run: | 
        az webapp deployment slot delete \
          --resource-group $RESOURCE_GROUP \
          --name $WEBAPP_NAME \
          --slot $SLOT_NAME

  delete-deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write

    steps:
      - name: Delete Deployment Environment
        uses: strumwolf/delete-deployment-environment@45c821e46baa405e25410700fe2e9643929706a0 # v2.0.1
        with:
          environment: "PR #${{ github.event.number }}"
          token: ${{ github.token }}
          onlyRemoveDeployments: true
